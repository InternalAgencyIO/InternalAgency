[package]
name = "iat-b3-economy"
version = "0.1.0"
description = "Pure transition kernel and feature-gated runtime adapters for the retained IAT V2-to-B3 economic port"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "iat_b3_economy"
crate-type = ["cdylib", "lib"]

[features]
default = []
custom-heap = []
custom-panic = []
no-entrypoint = []
runtime-account-bridge = [
    "dep:solana-account-info",
    "dep:solana-clock",
    "dep:solana-rent",
    "dep:solana-sysvar",
    "dep:solana-zk-sdk",
    "dep:spl-token-2022-interface",
]
runtime-write-adapter = ["runtime-account-bridge"]
runtime-account-lifecycle = [
    "runtime-write-adapter",
    "dep:solana-cpi",
    "dep:solana-program-error",
    "dep:solana-system-interface",
]
runtime-token-2022-stake-ingress = [
    "runtime-account-bridge",
    "dep:solana-cpi",
    "dep:solana-instruction",
    "dep:solana-program-error",
    "dep:spl-transfer-hook-interface",
]
runtime-production-claim-lane-principal = [
    "runtime-write-adapter",
    "runtime-token-2022-stake-ingress",
]
runtime-production-claim-lane-principal-executor = [
    "runtime-production-claim-lane-principal",
]
runtime-production-open-position = [
    "runtime-account-lifecycle",
    "runtime-token-2022-stake-ingress",
]
runtime-production-open-position-executor = [
    "runtime-production-open-position",
]
runtime-production-settle-position-week = [
    "runtime-write-adapter",
    "runtime-token-2022-stake-ingress",
]
runtime-production-settle-position-week-executor = [
    "runtime-production-settle-position-week",
]
runtime-production-withdraw-position = ["runtime-token-2022-stake-ingress"]
runtime-production-withdraw-position-executor = [
    "runtime-production-withdraw-position",
]
runtime-production-dispatch = [
    "runtime-account-lifecycle",
    "runtime-production-claim-lane-principal-executor",
    "runtime-production-open-position-executor",
    "runtime-production-settle-position-week-executor",
    "runtime-production-withdraw-position-executor",
]
runtime-production-entrypoint = [
    "runtime-production-dispatch",
    "dep:solana-program-entrypoint",
    "dep:solana-program-error",
]
sbf-preflight-entrypoint = [
    "runtime-account-bridge",
    "dep:solana-program-entrypoint",
    "dep:solana-program-error",
]

[dependencies]
iat-b3-consensus = { path = "../iat_b3_consensus" }
sha2 = { version = "=0.10.9", default-features = false }
solana-account-info = { version = "=3.1.1", optional = true }
solana-clock = { version = "=3.2.0", features = ["sysvar"], optional = true }
solana-cpi = { version = "=3.1.0", optional = true }
solana-instruction = { version = "=3.5.0", optional = true }
solana-pubkey = { version = "=3.0.0", features = ["curve25519"] }
solana-program-entrypoint = { version = "=3.1.1", optional = true }
solana-program-error = { version = "=3.0.1", optional = true }
solana-rent = { version = "=3.1.0", features = ["sysvar"], optional = true }
solana-sdk-ids = "=3.1.0"
solana-sysvar = { version = "=3.1.1", optional = true }
solana-system-interface = { version = "=2.0.0", features = ["bincode"], optional = true }
solana-zk-sdk = { version = "=4.0.0", optional = true }
spl-token-2022-interface = { version = "=2.1.0", optional = true }
spl-transfer-hook-interface = { version = "=2.1.0", optional = true }

[dev-dependencies]
iat-v2 = { path = "../iat_v2", features = ["no-entrypoint"] }

[build-dependencies]
solana-pubkey = { version = "=3.0.0", features = ["curve25519"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
