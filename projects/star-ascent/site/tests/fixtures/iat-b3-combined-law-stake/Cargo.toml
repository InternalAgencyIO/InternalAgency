[package]
name = "iat-b3-combined-law-stake-rehearsal-economy"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]
members = ["."]
resolver = "2"

[features]
default = []
custom-heap = []
custom-panic = []

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
iat-b3-consensus = { path = "../../../programs/iat_b3_consensus" }
iat-b3-economy = { path = "../../../programs/iat_b3_economy", features = ["runtime-token-2022-stake-ingress"] }
solana-account-info = "=3.1.1"
solana-clock = { version = "=3.2.0", features = ["sysvar"] }
solana-cpi = "=3.1.0"
solana-program-entrypoint = "=3.1.1"
solana-program-error = "=3.0.1"
solana-pubkey = { version = "=3.0.0", features = ["curve25519"] }
solana-rent = "=3.1.0"
solana-sdk-ids = "=3.1.0"
solana-system-interface = { version = "=2.0.0", features = ["bincode"] }
solana-sysvar = "=3.1.1"
spl-token-2022-interface = "=2.1.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
