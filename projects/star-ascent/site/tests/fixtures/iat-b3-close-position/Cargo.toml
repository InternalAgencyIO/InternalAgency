[package]
name = "iat-b3-close-position-rehearsal"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[features]
default = []
custom-heap = []
custom-panic = []

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
iat-b3-economy = { path = "../../../programs/iat_b3_economy", features = ["runtime-write-adapter"] }
solana-account-info = "=3.1.1"
solana-program-entrypoint = "=3.1.1"
solana-program-error = "=3.0.1"
solana-pubkey = { version = "=3.0.0", features = ["curve25519"] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
