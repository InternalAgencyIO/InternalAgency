name: Radiance proof

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  preview:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:preview
      - uses: actions/upload-artifact@v4
        with:
          name: radiance-windows-preview
          path: release/Radiance-preview-*-portable.exe
          if-no-files-found: error
          retention-days: 30

  standalone:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Check for the standalone video manifest
        id: video_manifest
        shell: pwsh
        run: |
          $present = (Test-Path -LiteralPath "assets/videos/manifest.json").ToString().ToLowerInvariant()
          "present=$present" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@v4
        if: steps.video_manifest.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.video_manifest.outputs.present == 'true'
        run: npm ci
      - if: steps.video_manifest.outputs.present == 'true'
        run: npm run dist
      - uses: actions/upload-artifact@v4
        if: steps.video_manifest.outputs.present == 'true'
        with:
          name: radiance-windows-portable
          path: release/Radiance-*-portable.exe
          if-no-files-found: error
          retention-days: 30
