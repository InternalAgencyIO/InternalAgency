name: Codex Guardian

on:
  push:
    branches: [main]
    tags: ['codex-guardian-v*']
    paths:
      - 'projects/codex-guardian/**'
      - '.github/workflows/codex-guardian-build.yml'
      - 'LICENSE'
  pull_request:
    paths:
      - 'projects/codex-guardian/**'
      - '.github/workflows/codex-guardian-build.yml'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: projects/codex-guardian
    steps:
      - name: Check out Guardian source
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /LICENSE
            /projects/codex-guardian/

      - name: Resolve package version
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME -replace '^codex-guardian-v', ''
          } else {
            '1.0.0'
          }
          "GUARDIAN_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify and package
        run: .\scripts\package.ps1 -Version $env:GUARDIAN_VERSION

      - name: Upload portable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codex-guardian-package
          path: projects/codex-guardian/artifacts/release/*
          if-no-files-found: error

  release-draft:
    if: startsWith(github.ref, 'refs/tags/codex-guardian-v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
        working-directory: projects/codex-guardian
    steps:
      - name: Check out release notes
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /projects/codex-guardian/RELEASE_NOTES_v*.md

      - name: Download verified package
        uses: actions/download-artifact@v4
        with:
          name: codex-guardian-package
          path: projects/codex-guardian/artifacts/release

      - name: Create tagged draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^codex-guardian-v', ''
          gh release create $env:GITHUB_REF_NAME `
            .\artifacts\release\CodexGuardian-$version-Windows-Portable.zip `
            .\artifacts\release\CodexGuardian-$version.exe `
            .\artifacts\release\SHA256SUMS.txt `
            .\artifacts\release\LICENSE.txt `
            --repo $env:GITHUB_REPOSITORY `
            --verify-tag `
            --draft `
            --title "Codex Guardian $version" `
            --notes-file ".\RELEASE_NOTES_v$version.md"
